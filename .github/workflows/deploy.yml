name: Deploy EcoTrack to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap project files from archive
        run: |
          if [ ! -f package.json ] && [ -f ecotrack_github_ready.zip ]; then
            rm -rf /tmp/ecotrack
            mkdir -p /tmp/ecotrack
            unzip -q ecotrack_github_ready.zip -d /tmp/ecotrack
            cp -a /tmp/ecotrack/. .
            rm -f ecotrack_github_ready.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Bootstrap EcoTrack project files"
            git push
          fi

      - name: Verify project structure
        run: |
          test -f package.json
          test -f index.html
          test -d src
          test -f vite.config.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
